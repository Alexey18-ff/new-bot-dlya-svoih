<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Для Своих — меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#f4f2ea; --card:#fff; --ink:#1e2a1b; --muted:#7d8576; --line:#e7e4d8;
  --g1:#7f9866; --g2:#4d6838; --gl:#e9efdf; --gd:#3c5230; --warn:#d9822b; --bad:#c9483a; --ok:#3f8f4f;
  --r:20px; --shadow:0 6px 22px rgba(60,82,48,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:120px}

/* hero */
.hero{margin:12px 12px 0;border-radius:28px;padding:18px 18px 16px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,#8fa874 0%,#587446 45%,#3b5230 100%)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.hero:before{width:180px;height:180px;right:-50px;top:-60px}
.hero:after{width:110px;height:110px;right:50px;bottom:-60px}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.18);display:grid;place-items:center;
  font:600 17px Unbounded,sans-serif;letter-spacing:-.5px;backdrop-filter:blur(4px)}
.brand{font:600 21px/1.1 Unbounded,sans-serif;letter-spacing:-.4px}
.sub{font-size:12px;opacity:.8;margin-top:3px;letter-spacing:.4px}
.contact-btn{margin-left:auto;background:rgba(255,255,255,.95);color:var(--gd);font-weight:700;font-size:13px;
  padding:9px 13px;border-radius:14px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.contact-btn:active{transform:scale(.96)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative;z-index:1}
.pill{background:rgba(255,255,255,.16);padding:7px 12px;border-radius:30px;font-size:12.5px;font-weight:600}
.closed{margin:12px 12px 0;padding:14px 16px;border-radius:16px;background:#fdecd6;color:#8a4d0a;font-weight:600;font-size:14px}

/* категории */
.cats{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:12px;scrollbar-width:none;
  background:linear-gradient(var(--bg) 78%,rgba(244,242,234,0))}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:10px 16px;border-radius:30px;background:var(--card);font-weight:700;font-size:14px;
  border:1.5px solid transparent;box-shadow:0 2px 8px rgba(60,82,48,.06);transition:.2s}
.cat.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 6px 16px rgba(77,104,56,.32)}

/* блюда */
.sec{padding:0 12px;scroll-margin-top:64px}
.sec h2{font:600 18px Unbounded,sans-serif;letter-spacing:-.3px;margin:18px 4px 12px;display:flex;align-items:center;gap:10px}
.sec h2 small{font:600 12px Manrope;color:var(--muted);background:var(--gl);padding:3px 9px;border-radius:20px;color:var(--g2)}
.dish{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;
  box-shadow:var(--shadow);animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ico{flex:none;width:58px;height:58px;border-radius:17px;background:var(--gl);display:grid;place-items:center;font-size:29px}
.info{flex:1;min-width:0}
.name{font-weight:700;font-size:15px;line-height:1.25}
.desc{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.3}
.price{font-weight:800;font-size:15px;margin-top:6px;color:var(--g2)}
.ctl{flex:none}
.add{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:24px;
  display:grid;place-items:center;box-shadow:0 6px 14px rgba(77,104,56,.3);transition:.15s}
.add:active{transform:scale(.9)}
.step{display:flex;align-items:center;background:var(--gl);border-radius:14px;padding:3px}
.step button{width:34px;height:34px;border-radius:11px;background:#fff;font-size:20px;font-weight:700;color:var(--g2);
  box-shadow:0 2px 6px rgba(0,0,0,.08)}
.step b{min-width:28px;text-align:center;font-weight:800}
.dish.off{opacity:.55}.dish.off .ico{filter:grayscale(1)}
.sold{font-size:12px;font-weight:700;color:var(--muted);background:#eceae0;padding:7px 10px;border-radius:10px;white-space:nowrap}

/* корзина-бар */
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;z-index:30;
  height:62px;border-radius:20px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  background:linear-gradient(100deg,#7f9866 0%,#4d6838 100%);box-shadow:0 12px 30px rgba(60,82,48,.45);
  font-weight:800;font-size:16px;transform:translateY(120px);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.cartbar.show{transform:none}
.cartbar .l{display:flex;align-items:center;gap:10px}
.cartbar .cnt{background:rgba(255,255,255,.22);min-width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px}
.cartbar:active{filter:brightness(.95)}

/* шторка */
.ov{position:fixed;inset:0;z-index:50;display:none}
.ov.open{display:block}
.bd{position:absolute;inset:0;background:rgba(20,30,15,.5);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;
  max-height:92vh;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:5px;background:#d3d0c2;margin:6px auto 12px}
.sh-title{display:flex;justify-content:space-between;align-items:center;font:600 20px Unbounded,sans-serif;margin-bottom:14px}
.x{width:36px;height:36px;border-radius:12px;background:#e8e5d9;font-size:16px}
.box{background:var(--card);border-radius:18px;padding:6px 14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .n{flex:1;font-weight:600;font-size:14px}.row .p{font-weight:800;font-size:14px;min-width:62px;text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#e8e5d9;padding:4px;border-radius:16px;margin-bottom:12px}
.seg button{padding:11px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--g2);box-shadow:0 2px 8px rgba(0,0,0,.08)}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 4px 5px}
.in{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:0;font-size:15px}
.in:focus{border-color:var(--g1);box-shadow:0 0 0 4px rgba(127,152,102,.18)}
textarea.in{resize:vertical;min-height:80px}
.sum{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:14px 4px}
.sum.sm{font-size:14px;font-weight:600;color:var(--muted);margin:6px 4px}
.btn{width:100%;height:58px;border-radius:18px;font-weight:800;font-size:16px;color:#fff;
  background:linear-gradient(100deg,#7f9866,#4d6838);box-shadow:0 10px 24px rgba(77,104,56,.38);transition:.15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6}
.btn.ghost{background:#fff;color:var(--g2);box-shadow:none;border:1.5px solid var(--line);margin-top:10px}
.btn.sm{height:46px;font-size:14px;border-radius:14px;box-shadow:none}
.err{color:var(--bad);font-size:13px;font-weight:600;margin:0 4px 10px;min-height:0}
.opt{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;text-decoration:none;color:inherit}
.opt i{font-style:normal;width:46px;height:46px;border-radius:14px;background:var(--gl);display:grid;place-items:center;font-size:22px}
.opt b{display:block;font-size:15px}.opt span{font-size:12.5px;color:var(--muted)}


.mapbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin:0 0 12px}
#delivery-map{height:230px;border-radius:12px;overflow:hidden;background:#e9efdf;z-index:1}
.map-actions{display:flex;gap:8px;margin:9px 0 4px}
.map-actions button{flex:1;background:var(--gl);color:var(--g2);border-radius:11px;padding:10px;font-weight:700;font-size:12px}
.coords{font-size:11px;color:var(--muted);padding:3px 2px}
/* экран "заказ оформлен" */
.done{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:28px 16px 30px;display:none}
.done.open{display:block}
.done-in{max-width:520px;margin:0 auto;text-align:center}
.check{width:96px;height:96px;border-radius:50%;margin:10px auto 18px;display:grid;place-items:center;
  background:linear-gradient(135deg,#8fb06f,#4d8a45);box-shadow:0 14px 34px rgba(77,138,69,.4);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.check svg{width:46px;height:46px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:50;stroke-dashoffset:50;animation:draw .5s .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.check.bad{background:linear-gradient(135deg,#e07b6c,#c9483a);box-shadow:0 14px 34px rgba(201,72,58,.4)}
.done h2{font:600 24px Unbounded,sans-serif;margin:0 0 8px;letter-spacing:-.5px}
.done p.lead{color:var(--muted);margin:0 8px 20px;font-size:14.5px;line-height:1.45}
.steps{list-style:none;margin:0 0 16px;padding:16px 18px;background:#fff;border-radius:20px;text-align:left}
.steps li{display:flex;gap:14px;align-items:center;padding:9px 0;position:relative;font-weight:600;font-size:14.5px;color:var(--muted)}
.steps li:not(:last-child):after{content:"";position:absolute;left:13px;top:36px;width:2px;height:16px;background:var(--line)}
.dot{width:28px;height:28px;border-radius:50%;background:#ebe8dc;display:grid;place-items:center;font-size:13px;flex:none;color:#fff}
.steps li.done-s{color:var(--ink)}.steps li.done-s .dot{background:var(--ok)}
.steps li.act{color:var(--ink)}.steps li.act .dot{background:var(--warn);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,130,43,.5)}100%{box-shadow:0 0 0 12px rgba(217,130,43,0)}}
.receipt{background:#fff;border-radius:20px;padding:6px 18px;text-align:left;margin-bottom:16px}
.receipt .row .n{font-weight:600}
.receipt .meta{font-size:13px;color:var(--muted);padding:10px 0;border-top:1px solid var(--line)}

/* админка */
.ahead{margin:12px 12px 0;padding:18px;border-radius:24px;background:linear-gradient(120deg,#3c5230,#587446);color:#fff}
.ahead h1{font:600 19px Unbounded,sans-serif;margin:0 0 4px}.ahead small{opacity:.8}
.stale{margin:10px 12px 0;padding:12px 14px;border-radius:14px;background:#fdecd6;color:#8a4d0a;font-weight:700;font-size:13.5px}
.fresh{background:#e1f0dd;color:#2d6a38}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px}
.tools .btn{height:50px;font-size:14px}
.swrow{margin:0 12px;background:#fff;border-radius:16px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14.5px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:30px;background:#d4d1c3;transition:.2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i:after{transform:translateX(20px)}
.arow{background:#fff;border-radius:18px;padding:12px 12px 12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.arow .info .name{font-size:14.5px}.arow .price{margin-top:2px;font-size:14px}
.arow.off .name{text-decoration:line-through;color:var(--muted)}
.ib{width:38px;height:38px;border-radius:12px;background:var(--gl);font-size:16px;flex:none}
.ib.del{background:#f8e3df}
.legend{font-size:12px;color:var(--muted);margin:0 16px 4px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-100px);background:#1e2a1b;color:#fff;padding:12px 18px;border-radius:14px;
  font-weight:600;font-size:14px;z-index:100;transition:.3s;max-width:90%}
.toast.show{transform:translate(-50%,0)}
.center{padding:70px 24px;text-align:center;color:var(--muted)}
.skel{height:84px;border-radius:20px;margin:0 12px 10px;background:linear-gradient(90deg,#ebe8dc 25%,#f5f3ea 50%,#ebe8dc 75%);background-size:200%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="cartbar" class="cartbar" data-act="cart"></div>
<div id="ov" class="ov"><div class="bd" data-act="close"></div><div class="sheet" id="sheet"></div></div>
<div id="done" class="done"></div>
<div id="toast" class="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
const INIT = (tg && tg.initData) || '';
const ADMIN_MODE = new URLSearchParams(location.search).get('admin') === '1';
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#f4f2ea'); tg.setBackgroundColor('#f4f2ea'); } catch(e){} }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CUR = 'руб.';
const money = n => (Number.isInteger(+n) ? String(n) : (+n).toFixed(2)).replace('.', ',') + ' ' + CUR;
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const dateRu = iso => { const [y,m,d] = iso.split('-'); return `${+d} ${MONTHS[+m-1]}`; };
const haptic = (t='light') => { try { tg.HapticFeedback.impactOccurred(t); } catch(e){} };
const note = (t) => { try { tg.HapticFeedback.notificationOccurred(t); } catch(e){} };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2600); }

async function api(path, body) {
  const opt = { headers: { 'X-Init-Data': INIT, 'Content-Type': 'application/json' } };
  if (body !== undefined) { opt.method = 'POST'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Ошибка сети');
  return j;
}
const ICONS = [['салат','🥗'],['суп','🍲'],['горяч','🍖'],['гарнир','🍚'],['напит','🥤'],['десерт','🍰'],['пицц','🍕'],['бургер','🍔'],['выпеч','🥐'],['завтрак','🍳'],['паст','🍝'],['рыб','🐟'],['хлеб','🍞']];
const iconFor = n => { n = n.toLowerCase(); for (const [k,v] of ICONS) if (n.includes(k)) return v; return '🍽'; };
const store = { get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

/* ============================ КЛИЕНТ ============================ */
let M = null;                       // меню с сервера
const cart = {};                    // id -> qty
const form = { type:'delivery', name: store.get('f_name') || (tg?.initDataUnsafe?.user?.first_name || ''),
               phone: store.get('f_phone'), address: store.get('f_addr'), comment:'', object_type:'Квартира', unit_number:'', entrance:'', floor:'', intercom:'', latitude:null, longitude:null, map_address:'' };
let activeOrder = null, pollTimer = null;

const allItems = () => M.categories.flatMap(c => c.items);
const itemById = id => allItems().find(i => i.id === id);
const cartCount = () => Object.values(cart).reduce((a,b)=>a+b,0);
const cartTotal = () => Math.round(Object.entries(cart).reduce((s,[id,q]) => s + (itemById(+id)?.price||0)*q, 0)*100)/100;

function ctlHtml(it) {
  if (!it.available) return '<span class="sold">Нет в наличии</span>';
  const q = cart[it.id] || 0;
  return q ? `<div class="step"><button data-act="dec" data-id="${it.id}">−</button><b>${q}</b><button data-act="inc" data-id="${it.id}">+</button></div>`
           : `<button class="add" data-act="inc" data-id="${it.id}" aria-label="Добавить">+</button>`;
}

async function loadClient() {
  $('#app').innerHTML = '<div style="height:150px"></div>' + '<div class="skel"></div>'.repeat(5);
  try { M = await api('/api/menu'); } catch(e) { $('#app').innerHTML = `<div class="center">Не удалось загрузить меню 😔<br>${esc(e.message)}</div>`; return; }
  CUR = M.currency;
  // убираем из корзины то, чего больше нет
  Object.keys(cart).forEach(id => { const it = itemById(+id); if (!it || !it.available) delete cart[id]; });
  renderClient();
}

function renderClient() {
  const cats = M.categories;
  let h = `<header class="hero">
    <div class="hero-top"><div class="logo">ДС</div>
      <div><div class="brand">${esc(M.cafe)}</div><div class="sub">CAFE &amp; DELIVERY</div></div>
      <button class="contact-btn" data-act="contact">💬 Связаться</button></div>
    <div class="hero-meta"><span class="pill">📅 Меню на ${dateRu(M.today)}</span>
      <span class="pill">🚚 Доставка от ${money(M.min_delivery)}</span></div></header>`;
  if (!M.orders_open) h += '<div class="closed">⏸ Сейчас приём заказов закрыт. Меню можно посмотреть, а заказать — позже.</div>';
  if (!cats.length) h += '<div class="center">Меню на сегодня пока не готово 🍃</div>';
  h += `<nav class="cats" id="cats">${cats.map((c,i)=>`<button class="cat ${i?'':'on'}" data-act="goto" data-i="${i}">${iconFor(c.name)} ${esc(c.name)}</button>`).join('')}</nav>`;
  cats.forEach((c, ci) => {
    h += `<section class="sec" id="sec${ci}"><h2>${esc(c.name)} <small>${c.items.length}</small></h2>`;
    c.items.forEach((it, k) => {
      h += `<div class="dish ${it.available?'':'off'}" data-id="${it.id}" style="animation-delay:${Math.min(k,8)*45}ms">
        <div class="ico">${iconFor(c.name)}</div>
        <div class="info"><div class="name">${esc(it.name)}</div>${it.desc?`<div class="desc">${esc(it.desc)}</div>`:''}
        <div class="price">${money(it.price)}</div></div><div class="ctl">${ctlHtml(it)}</div></div>`;
    });
    h += '</section>';
  });
  $('#app').innerHTML = h;
  updateBar();
}

function updateDish(id) { const el = document.querySelector(`.dish[data-id="${id}"] .ctl`); if (el) el.innerHTML = ctlHtml(itemById(id)); }
function updateBar() {
  const n = cartCount(), bar = $('#cartbar');
  bar.innerHTML = `<span class="l"><span class="cnt">${n}</span> Корзина</span><span>${money(cartTotal())}</span>`;
  bar.classList.toggle('show', n > 0 && !ADMIN_MODE && !$('#ov').classList.contains('open') && !$('#done').classList.contains('open'));
}
function change(id, d) {
  const it = itemById(id); if (!it) return;
  const q = Math.max(0, Math.min(50, (cart[id]||0) + d));
  if (q) cart[id] = q; else delete cart[id];
  haptic(); updateDish(id); updateBar();
  if ($('#ov').classList.contains('open') && $('#sheet').dataset.kind === 'cart') { if (!cartCount()) closeSheet(); else renderCart(); }
}

/* шторки */
function openSheet(html, kind) { const was = $('#ov').classList.contains('open'); $('#sheet').style.animation = was ? 'none' : ''; $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').dataset.kind = kind; $('#ov').classList.add('open'); $('#cartbar').classList.remove('show'); }
function closeSheet() { $('#ov').classList.remove('open'); updateBar(); }

function renderCart() {
  const f = form, tot = cartTotal();
  const rows = Object.entries(cart).map(([id,q]) => { const it = itemById(+id);
    return `<div class="row"><div class="n">${esc(it.name)}</div>
      <div class="step"><button data-act="dec" data-id="${id}">−</button><b>${q}</b><button data-act="inc" data-id="${id}">+</button></div>
      <div class="p">${money(it.price*q)}</div></div>`; }).join('');
  const below = f.type === 'delivery' && tot < M.min_delivery;
  const sc = $('#sheet').scrollTop;
  openSheet(`<div class="sh-title">Ваш заказ <button class="x" data-act="close">✕</button></div>
    <div class="box">${rows}</div>
    <div class="seg"><button class="${f.type==='delivery'?'on':''}" data-act="type" data-v="delivery">🚚 Доставка</button>
      <button class="${f.type==='pickup'?'on':''}" data-act="type" data-v="pickup">🏃 Самовывоз</button></div>
    <label class="f"><span>Ваше имя</span><input class="in" data-f="name" value="${esc(f.name)}" autocomplete="name"></label>
    <label class="f"><span>Телефон</span><input class="in" data-f="phone" type="tel" inputmode="tel" placeholder="+375 ..." value="${esc(f.phone)}" autocomplete="tel"></label>
    ${f.type==='delivery' ? `
    <label class="f"><span>Адрес доставки (улица, дом)</span><input class="in" data-f="address" placeholder="Например, ул. Ленина, 10" value="${esc(f.address)}" autocomplete="street-address"></label>
    <div class="mapbox"><b style="display:block;margin:2px 2px 8px">📍 Отметьте место доставки на карте</b><div id="delivery-map"></div>
      <div class="map-actions"><button type="button" data-act="geo">◎ Моё местоположение</button><button type="button" data-act="clear-map">Сбросить точку</button></div>
      <div class="coords" id="map-coords">${f.latitude!=null ? `Точка выбрана: ${Number(f.latitude).toFixed(5)}, ${Number(f.longitude).toFixed(5)}` : 'Нажмите на карту, чтобы поставить метку'}</div></div>
    <div class="seg"><button class="${f.object_type==='Квартира'?'on':''}" data-act="object" data-v="Квартира">🏠 Квартира</button><button class="${f.object_type==='Помещение'?'on':''}" data-act="object" data-v="Помещение">🏢 Помещение</button></div>
    <label class="f"><span>${f.object_type==='Квартира'?'Номер квартиры':'Номер помещения'}</span><input class="in" data-f="unit_number" placeholder="Например, 25" value="${esc(f.unit_number)}"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><label class="f"><span>Подъезд</span><input class="in" data-f="entrance" placeholder="№" value="${esc(f.entrance)}"></label><label class="f"><span>Этаж</span><input class="in" data-f="floor" placeholder="№" value="${esc(f.floor)}"></label></div>
    <label class="f"><span>Код домофона</span><input class="in" data-f="intercom" placeholder="Код или «не работает»" value="${esc(f.intercom)}"></label>` : ''}
    <label class="f"><span>Комментарий (необязательно)</span><textarea class="in" data-f="comment" placeholder="Например: без лука, позвонить у подъезда">${esc(f.comment)}</textarea></label>
    ${below ? `<div class="err">Минимальная сумма доставки — ${money(M.min_delivery)}. Добавьте ещё блюда или выберите самовывоз.</div>` : '<div class="err" id="err"></div>'}
    <div class="sum"><span>Итого</span><span>${money(tot)}</span></div>
    <button class="btn" id="submit" data-act="submit" ${(!M.orders_open||below)?'disabled':''}>Оформить заказ · ${money(tot)}</button>`, 'cart');
  $('#sheet').scrollTop = sc;
  if (f.type === 'delivery') setTimeout(initDeliveryMap, 80);
}


let deliveryMap=null, deliveryMarker=null;
function setDeliveryPoint(lat,lon){
  form.latitude=Number(lat); form.longitude=Number(lon);
  const label=$('#map-coords'); if(label) label.textContent=`Точка выбрана: ${form.latitude.toFixed(5)}, ${form.longitude.toFixed(5)}`;
  if(deliveryMarker) deliveryMarker.setLatLng([form.latitude,form.longitude]);
  else if(deliveryMap) deliveryMarker=L.marker([form.latitude,form.longitude],{draggable:true}).addTo(deliveryMap);
  if(deliveryMarker) deliveryMarker.off('dragend').on('dragend',()=>{const p=deliveryMarker.getLatLng();form.latitude=p.lat;form.longitude=p.lng;const el=$('#map-coords');if(el)el.textContent=`Точка выбрана: ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;});
}

function initDeliveryMap(){
  const el=$('#delivery-map');
  if(!el||!window.L)return;

  if(deliveryMap){
    deliveryMap.remove();
    deliveryMap=null;
    deliveryMarker=null;
  }

  const start=form.latitude!=null
    ? [form.latitude,form.longitude]
    : [53.9,27.5667];

  deliveryMap=L.map(el).setView(
    start,
    form.latitude!=null?16:12
  );

  // Убираем надпись Leaflet
  deliveryMap.attributionControl.setPrefix(false);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom:19,
      attribution:'&copy; OpenStreetMap'
    }
  ).addTo(deliveryMap);

  if(form.latitude!=null){
    setDeliveryPoint(form.latitude,form.longitude);
  }

  deliveryMap.on('click',e=>{
    setDeliveryPoint(e.latlng.lat,e.latlng.lng);
  });

  setTimeout(()=>deliveryMap.invalidateSize(),100);
}

function locateDelivery(){
  if(!navigator.geolocation)return toast('Геолокация недоступна');
  navigator.geolocation.getCurrentPosition(pos=>{const {latitude,longitude}=pos.coords;if(deliveryMap)deliveryMap.setView([latitude,longitude],17);setDeliveryPoint(latitude,longitude);},()=>toast('Не удалось получить геолокацию. Разрешите доступ или выберите точку на карте.'),{enableHighAccuracy:true,timeout:12000});
}

function openContact() {
  const bot = M?.bot_username;
  openSheet(`<div class="sh-title">Связаться с нами <button class="x" data-act="close">✕</button></div>
    ${bot ? `<button class="opt" style="width:100%;text-align:left" data-act="chat"><i>💬</i><div><b>Написать администратору</b><span>Ответ придёт прямо в чат с ботом</span></div></button>` : ''}
    <a class="opt" href="tel:${esc(M.phone)}"><i>📞</i><div><b>Позвонить</b><span>${esc(M.phone)}</span></div></a>
    ${M.admin_username ? `<button class="opt" style="width:100%;text-align:left" data-act="direct"><i>👤</i><div><b>Личное сообщение</b><span>@${esc(M.admin_username)}</span></div></button>` : ''}`, 'contact');
}
function tgLink(url) { if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank'); }

async function submitOrder() {
  const btn = $('#submit'), err = $('#err');
  const set = m => { if (err) err.textContent = m; };
  set('');
  if (!form.name.trim()) return set('Введите имя');
  if (form.phone.replace(/\D/g,'').length < 7) return set('Введите номер телефона');
  if (form.type === 'delivery' && !form.address.trim()) return set('Укажите адрес доставки');
  if (form.type === 'delivery' && (form.latitude == null || form.longitude == null)) return set('Выберите точку доставки на карте');
  if (form.type === 'delivery' && !form.unit_number.trim()) return set('Укажите номер квартиры или помещения');
  btn.disabled = true; btn.textContent = 'Отправляем…';
  try {
    const o = await api('/api/order', { ...form, items: Object.entries(cart).map(([id,qty]) => ({id:+id, qty})) });
    store.set('f_name', form.name); store.set('f_phone', form.phone); store.set('f_addr', form.address);
    Object.keys(cart).forEach(k => delete cart[k]); form.comment = '';
    closeSheet(); renderClient(); showDone(o); note('success');
  } catch(e) { set(e.message); btn.disabled = false; btn.textContent = 'Оформить заказ'; note('error'); }
}

/* экран «заказ оформлен» */
function showDone(o) {
  activeOrder = o; renderDone(); $('#done').classList.add('open'); $('#cartbar').classList.remove('show'); $('#done').scrollTop = 0;
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try { const n = await api('/api/order/' + o.id);
      if (n.status !== activeOrder.status) { activeOrder = n; renderDone(); note(n.status === 'rejected' ? 'error' : 'success'); }
      if (['ready','rejected'].includes(n.status)) clearInterval(pollTimer);
    } catch(e) {}
  }, 4000);
}
function renderDone() {
  const o = activeOrder, st = o.status, bad = st === 'rejected', del = o.type === 'delivery';
  const lead = { new: 'Мы отправили заказ администратору. Как только он подтвердит — вы получите уведомление в Telegram.',
    accepted: del ? 'Заказ подтверждён и уже готовится. Скоро передадим курьеру.' : 'Заказ подтверждён и уже готовится. Ждём вас на самовывоз.',
    ready: del ? 'Курьер выехал к вам. Приятного аппетита! 🍽' : 'Заказ готов — можно забирать. Приятного аппетита! 🍽',
    rejected: 'К сожалению, мы не смогли принять этот заказ. Свяжитесь с нами — всё решим.' }[st];
  const title = { new: 'Заказ оформлен', accepted: 'Заказ подтверждён', ready: del ? 'Заказ в пути' : 'Заказ готов', rejected: 'Заказ не принят' }[st];
  const idx = { new: 1, accepted: 2, ready: 3 }[st] ?? 1;
  const step = (i, txt, ic) => `<li class="${bad ? '' : i < idx ? 'done-s' : i === idx ? 'act' : ''}"><span class="dot">${i < idx && !bad ? '✓' : ic}</span>${txt}</li>`;
  $('#done').innerHTML = `<div class="done-in">
    <div class="check ${bad?'bad':''}">${bad ? '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'}</div>
    <h2>${title} №${o.id}</h2><p class="lead">${lead}</p>
    ${bad ? '' : `<ul class="steps">${step(1,'Заказ отправлен','1')}${step(2,'Подтверждение администратором','2')}${step(3, del ? 'Передан курьеру' : 'Готов к выдаче','3')}</ul>`}
    <div class="receipt">${o.items.map(i=>`<div class="row"><div class="n">${esc(i.name)} × ${i.qty}</div><div class="p">${money(i.price*i.qty)}</div></div>`).join('')}
      <div class="row"><div class="n"><b>Итого</b></div><div class="p">${money(o.total)}</div></div>
      <div class="meta">${del ? '🚚 Доставка: ' + esc(o.address) : '🏃 Самовывоз'}</div></div>
    <button class="btn" data-act="back">Вернуться в меню</button>
    <button class="btn ghost" data-act="contact">💬 Связаться с админом</button></div>`;
}

/* ============================ АДМИН ============================ */
let A = null;
async function loadAdmin() {
  try { await api('/api/me').then(m => { if (!m.is_admin) throw new Error('Нет доступа'); }); A = await api('/api/admin/menu'); }
  catch(e) { $('#app').innerHTML = `<div class="center">🔒 ${esc(e.message === 'forbidden' ? 'Нет доступа' : e.message)}</div>`; return; }
  renderAdmin();
}
function renderAdmin() {
  const fresh = A.updated === A.today;
  const cats = {}; A.items.forEach(i => (cats[i.category] ||= []).push(i));
  let h = `<div class="ahead"><h1>Меню на день</h1><small>Сегодня, ${dateRu(A.today)}</small></div>
    <div class="stale ${fresh?'fresh':''}">${fresh ? '✓ Меню обновлено сегодня' : '⚠ Меню не обновлялось сегодня — загрузите новое или проверьте блюда'}</div>
    <div class="tools"><button class="btn" data-act="a-new">＋ Блюдо</button><button class="btn" data-act="a-import">📋 Меню текстом</button></div>
    <div class="swrow"><span>Приём заказов</span><label class="sw"><input type="checkbox" data-act="a-open" ${A.orders_open?'checked':''}><i></i></label></div>
    <p class="legend" style="margin-top:14px">Переключатель справа — «есть в наличии». Выключенное блюдо клиенты видят как «нет в наличии».</p>`;
  for (const [c, items] of Object.entries(cats)) {
    h += `<section class="sec"><h2>${iconFor(c)} ${esc(c)} <small>${items.length}</small></h2>`;
    items.forEach(it => h += `<div class="arow ${it.available?'':'off'}"><div class="info"><div class="name">${esc(it.name)}</div><div class="price">${money(it.price)}</div></div>
      <button class="ib" data-act="a-edit" data-id="${it.id}">✎</button><button class="ib del" data-act="a-del" data-id="${it.id}">🗑</button>
      <label class="sw"><input type="checkbox" data-act="a-av" data-id="${it.id}" ${it.available?'checked':''}><i></i></label></div>`);
    h += '</section>';
  }
  $('#app').innerHTML = h;
}
async function reloadAdmin() { A = await api('/api/admin/menu'); renderAdmin(); }
function itemForm(it) {
  const cats = [...new Set(A.items.map(i => i.category))];
  it = it || { category: cats[0] || '', name: '', desc: '', price: '', available: true };
  openSheet(`<div class="sh-title">${it.id ? 'Редактировать' : 'Новое блюдо'} <button class="x" data-act="close">✕</button></div>
    <label class="f"><span>Категория (выберите или введите новую)</span><input class="in" id="i-cat" list="cl" value="${esc(it.category)}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
    <label class="f"><span>Название</span><input class="in" id="i-name" value="${esc(it.name)}"></label>
    <label class="f"><span>Описание / состав (необязательно)</span><input class="in" id="i-desc" value="${esc(it.desc)}"></label>
    <label class="f"><span>Цена, ${CUR}</span><input class="in" id="i-price" type="number" step="0.1" min="0" inputmode="decimal" value="${it.price}"></label>
    <div class="err" id="err"></div><button class="btn" data-act="a-save" data-id="${it.id||''}">Сохранить</button>`, 'item');
}
function importForm() {
  const text = Object.entries(A.items.reduce((m,i)=>((m[i.category] ||= []).push(i),m),{}))
    .map(([c, its]) => c + '\n' + its.map(i => `${i.name} — ${String(i.price).replace('.', ',')}${i.desc ? ' | ' + i.desc : ''}`).join('\n')).join('\n\n');
  openSheet(`<div class="sh-title">Загрузить меню <button class="x" data-act="close">✕</button></div>
    <p class="legend" style="margin:0 0 10px">Вставьте или отредактируйте список блюд и цен. <b>При импорте старое меню будет заменено.</b></p>
    <textarea class="in" id="i-text" style="min-height:260px;font-size:14px;line-height:1.5" placeholder="Салаты&#10;Оливье с курицей — 5,5&#10;Винегрет — 4,5">${esc(text)}</textarea>
    <div class="err" id="err" style="margin-top:8px"></div><button class="btn" data-act="a-doimport">Сохранить меню</button>`, 'import');
}
const confirmBox = (msg) => new Promise(res => { if (tg && tg.showConfirm) tg.showConfirm(msg, res); else res(confirm(msg)); });

/* ============================ события ============================ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
  const act = el.dataset.act, id = +el.dataset.id;
  try {
    switch (act) {
      case 'inc': change(id, 1); break;
      case 'dec': change(id, -1); break;
      case 'close': closeSheet(); break;
      case 'goto': document.getElementById('sec' + el.dataset.i).scrollIntoView({ behavior: 'smooth' }); break;
      case 'type': form.type = el.dataset.v; renderCart(); break;
      case 'object': form.object_type=el.dataset.v; renderCart(); break;
      case 'geo': locateDelivery(); break;
      case 'clear-map': form.latitude=null;form.longitude=null;if($('#map-coords'))$('#map-coords').textContent='Нажмите на карту, чтобы поставить метку';if(deliveryMarker&&deliveryMap){deliveryMap.removeLayer(deliveryMarker);deliveryMarker=null;}break;
      case 'submit': submitOrder(); break;
      case 'cart': renderCart(); break;
      case 'contact': openContact(); break;
      case 'chat': tgLink(`https://t.me/${M.bot_username}?start=contact`); if (tg) tg.close(); break;
      case 'direct': tgLink(`https://t.me/${M.admin_username}`); break;
      case 'back': $('#done').classList.remove('open'); clearInterval(pollTimer); updateBar(); scrollTo({top:0,behavior:'smooth'}); break;
      case 'a-new': itemForm(); break;
      case 'a-edit': itemForm(A.items.find(i => i.id === id)); break;
      case 'a-import': importForm(); break;
      case 'a-del': if (await confirmBox('Удалить блюдо «' + A.items.find(i=>i.id===id).name + '»?')) { await api('/api/admin/delete', {id}); await reloadAdmin(); toast('Удалено'); } break;
      case 'a-save': {
        const body = { id: id || undefined, category: $('#i-cat').value, name: $('#i-name').value, desc: $('#i-desc').value, price: $('#i-price').value.replace(',', '.') };
        if (id) body.available = A.items.find(i => i.id === id).available;
        try { await api('/api/admin/item', body); closeSheet(); await reloadAdmin(); toast('Сохранено ✓'); } catch(er) { $('#err').textContent = er.message; }
        break; }
      case 'a-doimport':
        if (!await confirmBox('Заменить всё текущее меню этим списком?')) break;
        try { const r = await api('/api/admin/import', { text: $('#i-text').value }); closeSheet(); await reloadAdmin(); toast(`Меню обновлено: ${r.count} блюд ✓`); } catch(er) { $('#err').textContent = er.message; }
        break;
    }
  } catch (er) { toast(er.message); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.act === 'a-av') { try { await api('/api/admin/toggle', { id: +el.dataset.id, available: el.checked }); await reloadAdmin(); } catch(er) { toast(er.message); } }
  if (el.dataset.act === 'a-open') { try { await api('/api/admin/open', { open: el.checked }); toast(el.checked ? 'Приём заказов открыт' : 'Приём заказов закрыт'); } catch(er) { toast(er.message); } }
});
document.addEventListener('input', e => { const f = e.target.dataset.f; if (f) form[f] = e.target.value; });

// подсветка категории при прокрутке
let ticking = false;
addEventListener('scroll', () => { if (ticking || ADMIN_MODE || !M) return; ticking = true; requestAnimationFrame(() => {
  ticking = false; let cur = 0;
  M.categories.forEach((_, i) => { const s = document.getElementById('sec' + i); if (s && s.getBoundingClientRect().top < 110) cur = i; });
  document.querySelectorAll('.cat').forEach((b, i) => { b.classList.toggle('on', i === cur); if (i === cur) { const nav = $('#cats'); nav.scrollTo({ left: b.offsetLeft - 20, behavior: 'smooth' }); } });
}); }, { passive: true });

ADMIN_MODE ? loadAdmin() : loadClient();
</script>
